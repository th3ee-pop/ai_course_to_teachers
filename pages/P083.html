  <aside class="notes">【快过】接下来这个问题，我想请大家先在心里回答：哪些学习必须由学生亲自经历？不是所有内容都要动手，但有些经验很难被替代。比如材料的质感，操作的阻力，还有真实发生的变化。我们先不急着给统一答案，先看几个可感知的例子，再回头判断哪些可以数字化，哪些要留在学生手里。
    作用：引出真实学习与伦理部分。</aside>
