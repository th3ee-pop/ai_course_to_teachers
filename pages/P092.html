  <div class="body">
  <div class="reveal" data-step="1" style="display:flex;gap:72px;padding:40px 0">

      <p style="font-size:38px;line-height:1.65">学生亲自思考、交流、操作和创作，并说明自己怎样使用了AI。</p>
