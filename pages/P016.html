  <aside class="notes">【快过】技术段讲到这里，我们收束成一句话：学习重点转向提出任务、提供背景、判断结果。模型和工具会承担很多中间步骤，但教师需要持续参与这三件事。提出任务，是说清楚想让学生经历什么；提供背景，是交代年级、课时、器材和已有安排；判断结果，是看产出的内容是否准确、是否适合课堂。接下来我们回到教师熟悉的四个工作环节，看这些事分别发生在哪里。
    作用：收束技术解释段，把重点引回教师可操作的三件事。</aside>
