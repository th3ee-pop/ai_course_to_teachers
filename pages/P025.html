  <aside class="notes">【快过】很多老师都有这样的经历：拿到一份教案，环节齐全，活动也不少，但真正进班时还是用不上。原因通常不是写得少，而是它没有回答本班学生从哪里开始、这节课到底要得到什么。接下来我们不再泛泛地说‘AI帮我备课’，而是把需求写成可以委托的任务。
    作用：把教师常见困惑转为可委托的任务，引出设计环节。</aside>
