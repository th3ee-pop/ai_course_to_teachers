  <h2 class="title">AI做得越多，我们越需要决定保留什么</h2>
  <p class="sub reveal-none">把学生的判断、动手和合作留在学习里。</p>
  <!-- BODY:START -->
  <div class="body statement-body">
    <p class="statement-title serif">AI做得越多，我们越需要决定保留什么</p>
    <p class="statement-sub">把学生的判断、动手和合作留在学习里。</p>
  </div>
  <!-- BODY:END -->
  <aside class="notes">【快过】前面我们看了AI能帮忙整理、生成、回应。能力越强，越要问一个问题：哪些东西必须由学生亲自完成？如果AI把操作、判断和合作都替掉了，学习本身就没有发生。所以这句话不是反对用AI，而是提醒我们，在使用之前先决定保留什么。接下来的收尾部分，我们会从真实材料、动手操作和学生判断这些地方讲起。
    作用：从工具使用转折到真实学习和伦理收尾。</aside>
</section>
