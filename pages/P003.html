  <h2 class="title">我们今天要掌握的AI到底是什么？</h2>
  <!-- BODY:START -->
  <div class="body statement-body">
    <div class="rule" style="flex:0 0 4px;width:260px;background:var(--accent)"></div>
    <p class="statement-title serif">我们今天要掌握的AI到底是什么？</p>
  </div>
  <!-- BODY:END -->
  <aside class="notes">【停讲】刚才我们从政策看到了方向，但文件不会替我们回答一个更基本的问题：我们今天要掌握的AI到底是什么？先不急着给定义，请大家想一想自己生活里早就用过的AI：进出小区和校门的人脸识别、短视频平台越刷越准的推荐、手机上的天气预报——这些大家其实天天在用。它们和最近两年热议的生成式AI，是不是同一类东西？如果不是，差别在哪里？这个问题先放在心里，接下来几页，我们就从“以前的AI”和“生成式AI”的区别讲起，把这件事说清楚。
    作用：把政策要求转成一个老师真会问的问题，进入AI原理的科普。</aside>
</section>
