  <h2 class="title">怎样让学生真正进入学习情境？</h2>

  <!-- BODY:START -->
  <div class="body statement-body">
    <p class="statement-title serif">怎样让学生真正进入学习情境？</p>
    <p class="statement-sub">把情境变成学生可以操作、观察和解释的任务。</p>
  </div>
  <!-- BODY:END -->
  <aside class="notes">【快过】我们前面把设计环节说清楚了，接下来要问的是，学生到底怎样进入学习情境。情境不是把材料放上讲台，也不是把网页打开就算发生。学生要有可操作的任务，能观察变化，有机会表达，最后还要用证据解释。这一模块就沿着这个判断，看四季探究、诗句视频和语言交流三个主案例。
    作用：作为实施模块引题，把情境落到学生行动，提醒教师不要停留在材料展示。</aside>
</section>
