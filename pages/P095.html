  <script>
  /* P095 ANIM_I：四环节依次亮起 → 三类能力落位 → 三问浮现 → “进入下一轮”回环箭头闪一次。
     与 deck.js 的 data-rv 同步：按 → 推进一阶段；“播放”自动走完；“重置”回初态。 */
  (function () {
    'use strict';
    var sec = document.currentScript.closest('section.slide');
    if (!sec) return;
    var anim = sec.querySelector('.anim');
    var loop = sec.querySelector('.p95loop');
    var timers = [];

    function clear() { timers.forEach(clearTimeout); timers = []; }
    function allMode() { return document.body.classList.contains('reveal-all'); }
    function reveals() { return Array.prototype.slice.call(sec.querySelectorAll('.reveal')); }

    function setRv(n) {
      if (allMode()) return;
      var g = reveals();
      n = Math.max(0, Math.min(g.length, n));
      sec.dataset.rv = String(n);
      g.forEach(function (el, k) {
        el.classList.toggle('on', k < n);
        el.classList.toggle('last', k === n - 1);
      });
      sec.classList.toggle('all-on', n >= g.length);
      if (n >= 4) flash(); else unflash();
    }
    function flash() {
      if (!loop || loop.classList.contains('flash')) return;
      loop.classList.add('flash');
    }
    function unflash() { if (loop) loop.classList.remove('flash'); }

    function reset() { clear(); unflash(); setRv(0); anim.focus({ preventScroll: true }); }
    function play() {
      clear(); unflash(); setRv(0);
      [1, 2, 3, 4].forEach(function (n, i) {
        timers.push(setTimeout(function () { setRv(n); }, 420 + i * 2100));
      });
    }

    anim.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-a]'); if (!b) return;
      if (b.getAttribute('data-a') === 'play') play(); else reset();
    });

    function sync() {
      if (!sec.classList.contains('active')) { clear(); unflash(); return; }
      var n = parseInt(sec.dataset.rv || '0', 10) || 0;
      if (allMode() || sec.classList.contains('all-on') || n >= 4) flash();
    }
    new MutationObserver(sync).observe(sec, { attributes: true, attributeFilter: ['class', 'data-rv'] });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
    else sync();
    window.__anim_P095 = { play: play, reset: reset, set: setRv };
  })();
  </script>
