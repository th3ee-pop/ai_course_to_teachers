const COLORS = ["#e6194b", "#2ca02c", "#1f77b4", "#ff8c00", "#9467bd", "#17a2b8", "#8c564b", "#7aa800"];

let groups = {};          // 组号 -> {日期 -> 记录}

function parseCsv(text) {
  const rows = [];
  text.split(/\r?\n/).forEach(function (line, i) {
    if (!line.trim()) return;
    if (i === 0) return; // 表头
    const p = line.split(",");
    if (p.length < 6) return;
    rows.push({
      date: p[0].trim(), temp: parseFloat(p[1]), cloud: p[2].trim(),
      wind: p[3].trim(), rain: p[4].trim(), sid: p[5].trim()
    });
  });
  return rows;
}

function buildGroups(texts) {
  groups = {}; anomalies = []; contradictions = 0;
  for (let g = 1; g <= 8; g++) {
    const map = {};
    parseCsv(texts[String(g)]).forEach(function (r) {
      map[r.date] = r;
      if (isNaN(r.temp) || r.temp < 10 || r.temp > 45) anomalies.push({ g: g, date: r.date, temp: r.temp });
      if (r.cloud === "晴" && (r.rain === "小雨" || r.rain === "中雨")) contradictions++;
    });
    groups[g] = map;
  }
}

function parseYmd(s) { const p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmtCN(s) { const p = s.split("-"); return (+p[1]) + "月" + (+p[2]) + "日"; }
function fmtShort(s) { const p = s.split("-"); return (+p[1]) + "/" + (+p[2]); }

function weekdayRange(minD, maxD) {
  const out = [];
  let d = parseYmd(minD), end = parseYmd(maxD);
  while (d <= end) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) out.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function majority(dateStr, field, keys) {
  const cnt = {};
  let tot = 0;
  for (let g = 1; g <= 8; g++) {
    const r = groups[g][dateStr];
    if (r) { cnt[r[field]] = (cnt[r[field]] || 0) + 1; tot++; }
  }
  if (!tot) return null;
  let best = keys[0], bestN = -1;
  keys.forEach(function (k) { if ((cnt[k] || 0) > bestN) { bestN = cnt[k] || 0; best = k; } });
  return best;
}

/* ---------- 折线图 ---------- */
const LINE = { W: 1180, H: 600, ML: 100, MR: 40, MT: 36, MB: 100 };

function renderLegend() {
  const box = document.getElementById("lineLegend");
  box.innerHTML = "";
  for (let g = 1; g <= 8; g++) {
    const chip = document.createElement("span");
    chip.className = "chip" + (visible[g] ? "" : " off");
    chip.style.borderColor = COLORS[g - 1];
    chip.style.color = COLORS[g - 1];
    chip.innerHTML = '<span class="dot" style="background:' + COLORS[g - 1] + '"></span>第' + g + "组";
    chip.onclick = function () { visible[g] = !visible[g]; renderLegend(); renderLines(); };
    box.appendChild(chip);
  }
}

function renderLines() {
  const svg = document.getElementById("lineSvg");
  const temps = [];
  for (let g = 1; g <= 8; g++) {
    Object.keys(groups[g]).forEach(function (d) {
      const t = groups[g][d].temp;
      if (!isNaN(t) && t >= 10 && t <= 45) temps.push(t);
    });
  }
  let lo = Math.floor(Math.min.apply(null, temps));
  let hi = Math.ceil(Math.max.apply(null, temps));
  if (hi - lo < 10) { const c = (hi + lo) / 2; lo = Math.floor(c - 5); hi = Math.ceil(c + 5); }
  let step = 1;
  [1, 2, 5, 10, 20].forEach(function (s) { if ((hi - lo) / s > 8) step = s * 2 > 10 ? 10 : s * 2; });
  [2, 5, 10].forEach(function (s) { if ((hi - lo) / s <= 8) step = s; });
  const pw = LINE.W - LINE.ML - LINE.MR, ph = LINE.H - LINE.MT - LINE.MB;
  function X(i) { return LINE.ML + (dates.length === 1 ? pw / 2 : i * pw / (dates.length - 1)); }
  function Y(v) { return LINE.MT + (hi - v) * ph / (hi - lo); }

  let s = "";
  // 网格与Y刻度（整数）
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    s += '<line x1="' + LINE.ML + '" y1="' + Y(v) + '" x2="' + (LINE.W - LINE.MR) + '" y2="' + Y(v) + '" stroke="#e3eaf3" stroke-width="2"/>';
    s += '<text x="' + (LINE.ML - 14) + '" y="' + (Y(v) + 7) + '" font-size="19" font-weight="bold" fill="#5a7188" text-anchor="end">' + Math.round(v) + "</text>";
  }
  // Y轴标题
  s += '<text x="' + (LINE.ML - 62) + '" y="' + (LINE.MT + ph / 2) + '" font-size="24" font-weight="bold" fill="#14456e" text-anchor="middle" transform="rotate(-90 ' + (LINE.ML - 62) + " " + (LINE.MT + ph / 2) + ')">气温（°C）</text>';
  // X刻度与标签
  dates.forEach(function (d, i) {
    const x = X(i);
    s += '<line x1="' + x + '" y1="' + (LINE.MT + ph) + '" x2="' + x + '" y2="' + (LINE.MT + ph + 8) + '" stroke="#8ba0b5" stroke-width="2"/>';
    s += '<text x="' + x + '" y="' + (LINE.MT + ph + 36) + '" font-size="18" font-weight="bold" fill="#5a7188" text-anchor="end" transform="rotate(-40 ' + x + " " + (LINE.MT + ph + 36) + ')">' + fmtShort(d) + "</text>";
  });
  const m = dates[0].split("-");
  s += '<text x="' + (LINE.ML + pw / 2) + '" y="' + (LINE.H - 16) + '" font-size="24" font-weight="bold" fill="#14456e" text-anchor="middle">日期（' + m[0] + "年" + (+m[1]) + "月，周一至周五观测）</text>";
  // 各组折线（缺记录的日子断开，异常气温不画点）
  for (let g = 1; g <= 8; g++) {
    if (!visible[g]) continue;
    let path = "", open = false, prevIdx = -1;
    dates.forEach(function (d, i) {
      const r = groups[g][d];
      const ok = r && !isNaN(r.temp) && r.temp >= 10 && r.temp <= 45;
      if (!ok) { open = false; return; }
      if (open && i === prevIdx + 1) {
        path += " L" + X(i).toFixed(1) + " " + Y(r.temp).toFixed(1);
      } else {
        path += " M" + X(i).toFixed(1) + " " + Y(r.temp).toFixed(1);
      }
      open = true; prevIdx = i;
    });
    if (path) s += '<path class="line" d="' + path + '" fill="none" stroke="' + COLORS[g - 1] + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
    dates.forEach(function (d, i) {
      const r = groups[g][d];
      if (!r || isNaN(r.temp) || r.temp < 10 || r.temp > 45) return;
      s += '<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(r.temp).toFixed(1) + '" r="4.5" fill="' + COLORS[g - 1] + '" data-g="' + g + '" data-d="' + d + '" data-t="' + r.temp + '" data-s="' + r.sid + '"/>';
    });
  }
  svg.innerHTML = s;
  // 折线入场动画
  svg.querySelectorAll("path.line").forEach(function (p, i) {
    const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    p.getBoundingClientRect();
    p.style.transition = "stroke-dashoffset 1.1s ease " + (i * 0.07) + "s";
    p.style.strokeDashoffset = 0;
    setTimeout(function () { p.style.strokeDasharray = "none"; }, 1500 + i * 70);
  });
}

/* ---------- 饼图 ---------- */
function arcPath(cx, cy, r1, r2, a0, a1) {
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const x0 = cx + r1 * Math.cos(a0), y0 = cy + r1 * Math.sin(a0);
  const x1 = cx + r1 * Math.cos(a1), y1 = cy + r1 * Math.sin(a1);
  const x2 = cx + r2 * Math.cos(a1), y2 = cy + r2 * Math.sin(a1);
  const x3 = cx + r2 * Math.cos(a0), y3 = cy + r2 * Math.sin(a0);
  return "M" + x0 + "," + y0 + " A" + r1 + "," + r1 + " 0 " + large + " 1 " + x1 + "," + y1 +
         " L" + x2 + "," + y2 + " A" + r2 + "," + r2 + " 0 " + large + " 0 " + x3 + "," + y3 + " Z";
}

function renderPie(mode) {
  const isCloud = mode === "cloud";
  const keys = isCloud ? CLOUD_KEYS : RAIN_KEYS;
  const colors = isCloud ? CLOUD_COLORS : RAIN_COLORS;
  const field = isCloud ? "cloud" : "rain";
  const counts = {}; keys.forEach(function (k) { counts[k] = 0; });
  let days = 0;
  dates.forEach(function (d) {
    const m = majority(d, field, keys);
    if (m !== null) { counts[m]++; days++; }
  });
  const svg = document.getElementById("pieSvg");
  const cx = 230, cy = 230, r1 = 160, r2 = 88;
  let s = "", ang = -Math.PI / 2;
  keys.forEach(function (k) {
    const n = counts[k];
    if (n <= 0) return;
    const sweep = n / days * Math.PI * 2;
    if (n === days) {
      s += '<path d="' + arcPath(cx, cy, r1, r2, -Math.PI / 2, Math.PI / 2) + '" fill="' + colors[k] + '" stroke="#fff" stroke-width="3"/>';
      s += '<path d="' + arcPath(cx, cy, r1, r2, Math.PI / 2, Math.PI * 1.5) + '" fill="' + colors[k] + '" stroke="#fff" stroke-width="3"/>';
    } else {
      s += '<path d="' + arcPath(cx, cy, r1, r2, ang, ang + sweep) + '" fill="' + colors[k] + '" stroke="#fff" stroke-width="3"><title>' + (RAIN_LABEL[k] || k) + "：" + n + "天</title></path>";
    }
    ang += sweep;
  });
  s += '<text x="' + cx + '" y="' + (cy - 2) + '" font-size="64" font-weight="bold" fill="#14456e" text-anchor="middle">' + days + "</text>";
  s += '<text x="' + cx + '" y="' + (cy + 40) + '" font-size="24" font-weight="bold" fill="#4a6b8a" text-anchor="middle">个观测日</text>';
  svg.innerHTML = s;

  const lg = document.getElementById("pieLegend");
  lg.innerHTML = "";
  keys.forEach(function (k) {
    const pct = days ? Math.round(counts[k] / days * 100) : 0;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<span class="sw" style="background:' + colors[k] + '"></span>' +
      (RAIN_LABEL[k] || k) + "：" + counts[k] + " 天（" + pct + "%）";
    lg.appendChild(row);
  });
  document.getElementById("pieTitle").textContent = "二、全班" + days + "个观测日的天气分布";
}

/* ---------- 提示框 ---------- */
function bindTooltip() {
  const svg = document.getElementById("lineSvg");
  const tip = document.getElementById("tooltip");
  const wrap = document.querySelector(".chart-wrap");
  svg.addEventListener("mouseover", function (e) {
    const c = e.target.closest ? e.target.closest("circle.pt") : null;
    if (!c) return;
    const r = groups[+c.dataset.g][c.dataset.d];
    tip.innerHTML = fmtCN(c.dataset.d) + " · 第" + c.dataset.g + "组<br>气温 " + c.dataset.t + "°C · 记录员 " + c.dataset.s;
    tip.style.display = "block";
  });
  svg.addEventListener("mousemove", function (e) {
    if (tip.style.display !== "block") return;
    const rect = wrap.getBoundingClientRect();
    let x = e.clientX - rect.left + 16, y = e.clientY - rect.top - 10;
    if (x + tip.offsetWidth > rect.width) x = e.clientX - rect.left - tip.offsetWidth - 12;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  svg.addEventListener("mouseout", function (e) {
    if (e.target.closest && e.target.closest("circle.pt")) tip.style.display = "none";
  });
}

/* ---------- 数据小侦探 ---------- */
function compressRanges(ds) {
  const days = ds.map(parseYmd).sort(function (a, b) { return a - b; });
  const parts = [];
  let s0 = days[0], e0 = days[0];
  for (let i = 1; i <= days.length; i++) {
    const cur = days[i];
    if (cur && cur - e0 === 86400000) { e0 = cur; continue; }
    if (s0.getTime() === e0.getTime()) parts.push(fmtCN(s0.getFullYear() + "-" + String(s0.getMonth() + 1).padStart(2, "0") + "-" + String(s0.getDate()).padStart(2, "0")));
    else parts.push(fmtCN(s0.getFullYear() + "-" + String(s0.getMonth() + 1).padStart(2, "0") + "-" + String(s0.getDate()).padStart(2, "0")) + "至" + fmtCN(e0.getFullYear() + "-" + String(e0.getMonth() + 1).padStart(2, "0") + "-" + String(e0.getDate()).padStart(2, "0")));
    s0 = cur; e0 = cur;
  }
  return parts.join("、");
}

function renderNotes() {
  const ul = document.getElementById("noteList");
  const items = [];
  anomalies.forEach(function (a) {
    const others = [];
    for (let g = 1; g <= 8; g++) {
      const r = groups[g][a.date];
      if (g !== a.g && r && !isNaN(r.temp) && r.temp >= 10 && r.temp <= 45) others.push(r.temp);
    }
    const range = others.length ? "（其他组当天记的是" + Math.round(Math.min.apply(null, others)) + "–" + Math.round(Math.max.apply(null, others)) + "°C）" : "";
    items.push("🌡 第" + a.g + "组在" + fmtCN(a.date) + "把气温记成了 " + a.temp + "°C" + range + "，和其他组差了二十多度！看板没有把这个点画进折线图。想一想：可能是什么原因造成的？我们可以怎样核对？");
  });
  const missInfo = [];
  for (let g = 1; g <= 8; g++) {
    const miss = dates.filter(function (d) { return !groups[g][d]; });
    if (miss.length) missInfo.push("第" + g + "组缺了" + compressRanges(miss) + "，共" + miss.length + "天");
  }
  if (missInfo.length) {
    items.push("📏 " + missInfo.join("；") + "。所以这些组的折线会断开、变短。想一想：怎样才能让记录一天都不落下？（提示：排好轮值表，请假时请同组同学帮忙补记）");
  }
  if (contradictions > 0) {
    items.push("🔎 全班一共有 " + contradictions + ' 条"晴天却下雨"的记录：云量填了"晴"，降水却填了"小雨"或"中雨"，两项对不上。下笔之前，记得先抬头看一看：天上的云多不多？有没有在下雨？');
  }
  ul.innerHTML = items.map(function (t) { return "<li>" + t + "</li>"; }).join("");
}

/* ---------- 启动 ---------- */
(async function () {
  let texts = null, source = "页面内置的数据快照";
  try {
    const t = {};
    for (let g = 1; g <= 8; g++) {
      const res = await fetch("第" + g + "组天气观测记录.csv", { cache: "no-store" });
      if (!res.ok) throw new Error("读取失败");
      t[String(g)] = await res.text();
    }
    texts = t; source = "同文件夹的8个CSV文件（打开页面时实时读取）";
  } catch (e) {
    texts = RAW; // 浏览器限制本地读取时，回退到内置快照
  }
  buildGroups(texts);
  const all = [];
  for (let g = 1; g <= 8; g++) Object.keys(groups[g]).forEach(function (d) { all.push(d); });
  all.sort();
  dates = weekdayRange(all[0], all[all.length - 1]);
  const m = all[0].split("-");
  document.getElementById("subTitle").textContent = m[0] + "年" + (+m[1]) + "月 · 8个小组 · " + dates.length + "个观测日 · 天气记录讲评";
  renderLegend();
  renderLines();
  renderPie("cloud");
  bindTooltip();
  renderNotes();
  document.getElementById("btnCloud").onclick = function () {
    this.classList.add("on"); document.getElementById("btnRain").classList.remove("on"); renderPie("cloud");
  };
  document.getElementById("btnRain").onclick = function () {
    this.classList.add("on"); document.getElementById("btnCloud").classList.remove("on"); renderPie("rain");
  };
  document.getElementById("srcNote").textContent = "数据来源：" + source + " ｜ 本页面不依赖网络，双击即可打开";
})();
