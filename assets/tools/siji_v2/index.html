          <text y="115" fill="#5d6878" font-size="8.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace" x="103">4月</text>
          <text y="115" fill="#5d6878" font-size="8.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace" x="176">7月</text>
          <text y="115" fill="#5d6878" font-size="8.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace" x="249">10月</text>
        </svg>
      </div>
    </div>
  </div>
</div>
<script id="sim-formulas">
const D2R = Math.PI / 180;
const MD = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function toDate(day) {
  let d = Math.round(clamp(day, 1, 365)), m = 0;
  while (d > MD[m]) { d -= MD[m]; m++; }
  return { m: m + 1, d };
}

function decl(day, tilt) {
  const lam = (day - 80) / 365.2422 * Math.PI * 2;
  return Math.asin(Math.sin(tilt * D2R) * Math.sin(lam)) / D2R;
}

function dayLength(day, lat, tilt) {
  const decDeg = decl(day, tilt);
  // 教材把极圈写作 66.5°；以 0.1° 容差吸收一位小数近似，与 v1 教学口径一致。
  const polarBoundary = Math.abs(lat) + Math.abs(decDeg);
  if (Math.abs(decDeg) > 0 && polarBoundary >= 89.9) {
    const sameHemisphere = lat * decDeg > 0;
    return { hours: sameHemisphere ? 24 : 0, polar: sameHemisphere ? 'day' : 'night' };
  }
  const c = -Math.tan(lat * D2R) * Math.tan(decDeg * D2R);
  if (c <= -1) return { hours: 24, polar: 'day' };
  if (c >= 1) return { hours: 0, polar: 'night' };
  return { hours: 2 * Math.acos(c) / D2R / 15, polar: null };
}

function astronomy(day, lat, tilt) {
  const dec = decl(day, tilt);
  const daylight = dayLength(day, lat, tilt);
  const noonAlt = Math.max(90 - Math.abs(lat - dec), 0);
  return {
    dec,
    noonAlt,
    dayLen: daylight.hours,
    sunrise: daylight.polar ? null : 12 - daylight.hours / 2,
    sunset: daylight.polar ? null : 12 + daylight.hours / 2,
    polar: daylight.polar,
  };
}

function seasonAt(day, lat) {
  const { m } = toDate(day);
  const seasons = ['冬季', '春季', '夏季', '秋季'];
  const idx = m <= 2 || m === 12 ? 0 : m <= 5 ? 1 : m <= 8 ? 2 : 3;
  return seasons[lat >= 0 ? idx : (idx + 2) % 4];
}
</script>
<script>
const state = { day: 172, hour: 12, lat: 40, tilt: 23.44, view: 'space', open: true, playY: false, playD: false };
let raf = null;

const $ = id => document.getElementById(id);
const ui = {
  app: $('app'), stage: $('stage'), panel: $('control-panel'), panelOpen: $('panel-open-button'),
  setSpace: $('set-space'), setGround: $('set-ground'), hint: $('view-hint'),
  dateControl: $('date-control'), timeControl: $('time-control'), latControl: $('lat-control'), tiltLabel: $('tilt-label'),
  dayFill: $('day-fill'), dayKnob: $('day-knob'), hourFill: $('hour-fill'), hourKnob: $('hour-knob'), latKnob: $('lat-knob'),
  yearButton: $('toggle-year'), dayButton: $('toggle-day'), tiltTrack: $('tilt-track'), tiltKnob: $('tilt-knob'),
  dateReadout: $('date-readout'), seasonReadout: $('season-readout'), subsolar: $('subsolar-readout'),
  altitude: $('altitude-readout'), daylength: $('daylength-readout'), riseSet: $('risetset-readout'), polar: $('polar-status'),
  curveArea: $('curve-area'), curvePoints: $('curve-points'), curveLine: $('curve-line'), curveDot: $('curve-dot'),
};

function formatClock(value) {
  const minutes = Math.round(value * 60);
  const hh = Math.floor(minutes / 60) % 24;
  const mm = minutes % 60;
  return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}

function snapshot() {
  const data = astronomy(state.day, state.lat, state.tilt);
  return {
    day: state.day, hour: state.hour, lat: state.lat, tilt: state.tilt, view: state.view,
    dec: data.dec, noonAlt: data.noonAlt, dayLen: data.dayLen,
    sunrise: data.sunrise, sunset: data.sunset,
    season: seasonAt(state.day, state.lat), polar: data.polar,
  };
}

function update() {
  const data = snapshot();
  const { m, d } = toDate(state.day);
  const dateLabel = `${m}月${d}日`;
  const hh = Math.floor(state.hour), mm = Math.floor((state.hour - hh) * 60);
  const dayPct = `${((state.day - 1) / 364 * 100).toFixed(2)}%`;
  const hourPct = `${(state.hour / 24 * 100).toFixed(2)}%`;
  const latPct = `${((state.lat + 90) / 180 * 100).toFixed(2)}%`;

  ui.stage.setAttribute('day', state.day.toFixed(2));
  ui.stage.setAttribute('hour', state.hour.toFixed(3));
  ui.stage.setAttribute('lat', String(state.lat));
  ui.stage.setAttribute('tilt', String(state.tilt));
  ui.stage.setAttribute('view', state.view);
  ui.stage.setAttribute('grat', '1');
  ui.stage.setAttribute('starlv', '0.6');

  const space = state.view === 'space';
  ui.setSpace.style.background = space ? 'rgba(232,180,95,0.14)' : 'transparent';
  ui.setSpace.style.color = space ? '#f0d7a6' : '#8894a6';
  ui.setGround.style.background = space ? 'transparent' : 'rgba(232,180,95,0.14)';
  ui.setGround.style.color = space ? '#8894a6' : '#f0d7a6';
  ui.hint.textContent = space
    ? '拖动环视 · 滚轮缩放（拉远可见整条公转轨道）· 地轴始终指向同一方向'
    : '拖动环视天空 · 滚轮改变视野 · 橙色弧线是太阳今天走过的路径';

  ui.panel.style.display = state.open ? 'flex' : 'none';
  ui.panelOpen.style.display = state.open ? 'none' : 'block';
  ui.app.classList.toggle('panel-closed', !state.open);
  ui.dateControl.textContent = ui.dateReadout.textContent = dateLabel;
  ui.timeControl.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  ui.latControl.textContent = state.lat === 0 ? '赤道 0.0°' : `${state.lat > 0 ? '北纬' : '南纬'} ${Math.abs(state.lat).toFixed(1)}°`;
  ui.tiltLabel.textContent = state.tilt > 0.2 ? `${state.tilt.toFixed(2)}°` : '0°';
  ui.seasonReadout.textContent = data.season;
  ui.subsolar.textContent = Math.abs(data.dec) < 0.05 ? '赤道 0.0°' : `${data.dec > 0 ? '北纬' : '南纬'} ${Math.abs(data.dec).toFixed(1)}°`;
  ui.altitude.textContent = `${data.noonAlt.toFixed(1)}°`;
  ui.daylength.textContent = data.dayLen >= 24 ? '24 小时（极昼）' : data.dayLen <= 0 ? '0 小时（极夜）' : `${Math.floor(data.dayLen)} 小时 ${Math.round((data.dayLen % 1) * 60)} 分`;
  ui.riseSet.textContent = data.polar === 'day' ? '整日不落' : data.polar === 'night' ? '整日不升' : `${formatClock(data.sunrise)} · ${formatClock(data.sunset)}`;
  ui.polar.textContent = data.polar === 'day' ? '出现极昼：太阳整日不落到地平线以下。'
    : data.polar === 'night' ? '出现极夜：太阳整日不升出地平线。'
    : data.noonAlt <= 0 ? '太阳终日在地平线以下。'
    : '当前纬度无极昼、极夜现象。';

  ui.dayFill.style.width = ui.dayKnob.style.left = dayPct;
  ui.hourFill.style.width = ui.hourKnob.style.left = hourPct;
  ui.latKnob.style.left = latPct;
  ui.tiltTrack.style.opacity = state.tilt > 0.2 ? '1' : '0';
  ui.tiltKnob.style.left = state.tilt > 0.2 ? '22px' : '3px';
  ui.yearButton.textContent = state.playY ? '暂停' : '播放一年';
  ui.dayButton.textContent = state.playD ? '暂停一天' : '播放一天';

  const pts = [], area = ['30,98'];
  for (let i = 0; i <= 72; i++) {
    const dd = 1 + i / 72 * 364;
    const x = 30 + i / 72 * 290;
    const y = 98 - dayLength(dd, state.lat, state.tilt).hours / 24 * 90;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    area.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  area.push('320,98');
  const cx = (30 + (state.day - 1) / 364 * 290).toFixed(1);
  const cy = (98 - data.dayLen / 24 * 90).toFixed(1);
  ui.curvePoints.setAttribute('points', pts.join(' '));
  ui.curveArea.setAttribute('points', area.join(' '));
  ui.curveLine.setAttribute('x1', cx); ui.curveLine.setAttribute('x2', cx);
  ui.curveDot.setAttribute('cx', cx); ui.curveDot.setAttribute('cy', cy);
}

function tick() {
  if (!state.playY && !state.playD) { raf = null; return; }
  state.day = state.playY ? (state.day + 0.42 > 365 ? 1 : state.day + 0.42) : state.day;
  state.hour = state.playD ? (state.hour + 0.028 >= 24 ? 0 : state.hour + 0.028) : state.hour;
  update();
  raf = requestAnimationFrame(tick);
}

function play(key, value) {
  state[key] = value;
  update();
  if (!raf && (state.playY || state.playD)) raf = requestAnimationFrame(tick);
}

function drag(event, fn) {
  event.preventDefault();
  const rect = event.currentTarget.getBoundingClientRect();
  const move = ev => fn(clamp((ev.clientX - rect.left) / rect.width, 0, 1));
  move(event);
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

const setState = patch => { Object.assign(state, patch); update(); };
$('panel-close-button').addEventListener('click', () => setState({ open: false }));
ui.panelOpen.addEventListener('click', () => setState({ open: true }));
ui.setSpace.addEventListener('click', () => setState({ view: 'space' }));
ui.setGround.addEventListener('click', () => setState({ view: 'ground' }));
$('set-spring').addEventListener('click', () => setState({ day: 80, playY: false }));
$('set-summer').addEventListener('click', () => setState({ day: 172, playY: false }));
$('set-autumn').addEventListener('click', () => setState({ day: 266, playY: false }));
$('set-winter').addEventListener('click', () => setState({ day: 355, playY: false }));
$('set-equator').addEventListener('click', () => setState({ lat: 0 }));
$('set-beijing').addEventListener('click', () => setState({ lat: 40 }));
$('set-arctic').addEventListener('click', () => setState({ lat: 66.5 }));
ui.yearButton.addEventListener('click', () => play('playY', !state.playY));
ui.dayButton.addEventListener('click', () => play('playD', !state.playD));
$('toggle-tilt').addEventListener('click', () => setState({ tilt: state.tilt > 0.2 ? 0 : 23.44 }));
$('day-slider').addEventListener('pointerdown', e => drag(e, f => setState({ day: 1 + f * 364, playY: false })));
$('hour-slider').addEventListener('pointerdown', e => drag(e, f => setState({ hour: f * 24, playD: false })));
$('lat-slider').addEventListener('pointerdown', e => drag(e, f => setState({ lat: Math.round((-90 + f * 180) * 2) / 2 })));

window.__sim = {
  set(patch = {}) {
    if (Number.isFinite(patch.day)) { state.day = clamp(patch.day, 1, 365); state.playY = false; }
    if (Number.isFinite(patch.hour)) { state.hour = clamp(patch.hour, 0, 24); state.playD = false; }
    if (Number.isFinite(patch.lat)) state.lat = clamp(patch.lat, -90, 90);
    if (typeof patch.tilt === 'boolean') state.tilt = patch.tilt ? 23.44 : 0;
    else if (Number.isFinite(patch.tilt)) state.tilt = clamp(patch.tilt, 0, 90);
    if (patch.view === 'space' || patch.view === 'ground') state.view = patch.view;
    update();
    return this.get();
  },
  get() { return snapshot(); },
};

update();
</script>
</body>
