  <h2 class="title">同一项任务可以组合使用三种角色。</h2>
  <!-- BODY:START -->
  <div class="body stack" style="justify-content:center">
    <div class="reveal"><div class="label">备课时</div><p class="text">AI可以先追问教学目标，再整理教材和学情，随后生成配套材料。</p></div>
    <div class="reveal"><div class="label">审议时</div><p class="text">教师可以继续与AI比较方案、提出修改要求，并检查成果。</p></div>
    <div class="reveal"><div class="label">角色随任务变化</div><p class="text">管道、工具和主体可以重叠、往返，具体组合由任务需要决定。</p></div>
  </div>

  <aside class="notes">【停讲】讲述时依次说明：AI可以先追问教学目标，再整理教材和学情，随后生成配套材料。 教师可以继续与AI比较方案、提出修改要求，并检查成果。 管道、工具和主体可以重叠、往返，具体组合由任务需要决定。
    作用：说明三种角色可以组合与切换，不是固定三步。</aside>
